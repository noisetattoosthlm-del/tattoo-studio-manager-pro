name: Weekly Supabase Backup

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase Weekly Backup
        run: |
          curl -X POST https://yunuwkjydqzgkqtbgwup.supabase.co/functions/v1/hyper-function \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}"
